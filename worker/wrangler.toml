name = "borai-engagement"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Same-origin route so the site can fetch "/api/..." (set the zone up in
# Cloudflare first; borai.dev must be an active zone on your account).
routes = [
  { pattern = "blog.borai.dev/api/*", zone_name = "borai.dev" }
]

# Fill in the id from `wrangler kv namespace create ENGAGEMENT`.
kv_namespaces = [
  { binding = "ENGAGEMENT", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]
