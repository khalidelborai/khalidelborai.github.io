# Zola configuration — https://www.getzola.org/documentation/getting-started/configuration/
# Theme: terminus (https://github.com/ebkalderon/terminus)

base_url = "https://blog.borai.dev"
title = "Khalid Elborai"
description = "Khalid Elborai — CTO at Buguard, software engineer, and open-source contributor."
author = "Khalid Elborai"
theme = "terminus"

compile_sass = true
generate_feeds = true
# NOTE: minify_html stays OFF — Zola's minifier drops optional <html>/<body>
# tags, which breaks Pagefind's HTML parser (indexes 0 pages). gzip already
# compresses the whitespace, so the loss is negligible.
minify_html = false
# Search is provided by Pagefind (post-build), not Zola's elasticlunr index.
build_search_index = false

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true, paginate_by = 5 },
    { name = "series", feed = true },
]

[markdown]
render_emoji = true
bottom_footnotes = true
lazy_async_image = true
github_alerts = true
# Outbound links open in a new tab, don't pass referrer, and aren't endorsed.
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

[markdown.highlighting]
# Bundled with Terminus; classic terminal-style palette.
style = "inline"
extra_themes = ["syntaxes/monokai-classic.json"]
theme = "monokai-classic"

[extra]
# Retro terminal duotone. Switcher lets you try tokyo-night, nord, gruvbox-dark,
# catppuccin-*, synthwave-84, etc. without editing config.
color_scheme = "terminus"
color_scheme_switcher = true

# On-brand for a Rust engineer; no image asset needed.
favicon_emoji = "🦀"

layout = "center"
# Site-wide custom CSS (series box, etc.), loaded on top of the theme.
stylesheets = ["css/custom.css"]
copy_button = true
feed_icon = true
show_default_author = false
close_responsive_menu_on_resize = true

main_menu = [
    { name = "projects", url = "projects", trailing_slash = true },
    { name = "uses", url = "uses", trailing_slash = true },
    { name = "now", url = "now", trailing_slash = true },
    { name = "archive", url = "archive", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
    { name = "search", url = "search", trailing_slash = true },
    { name = "about", url = "about", trailing_slash = true },
    { name = "github", url = "https://github.com/khalidelborai", new_tab = true },
]

socials = [
    { name = "github", url = "https://github.com/khalidelborai" },
    { name = "x", url = "https://twitter.com/elborai_khalid" },
    { name = "email", url = "mailto:khalidelborai@hotmail.com" },
]

# giscus comments (GitHub Discussions). Add `comments = true` to a post's
# [extra] to enable. Requires the giscus GitHub App installed on the repo.
[extra.giscus]
repo = "khalidelborai/khalidelborai.github.io"
repo_id = "R_kgDOMec66A"
category = "Announcements"
category_id = "DIC_kwDOMec66M4C-x5_"
mapping = "pathname"
theme = "transparent_dark"

# Views + reactions are served by a same-origin Cloudflare Worker. Leave `api`
# empty to keep the widgets off; set it (e.g. "/api") once worker/ is deployed
# and routed at blog.borai.dev/api/*.
[extra.engagement]
api = "/api"

[extra.content_security_policy]
enable = true
# Pagefind search compiles a WebAssembly module at runtime, which requires
# 'wasm-unsafe-eval'. 'self' keeps every script same-origin (no inline JS).
# static.cloudflareinsights.com / cloudflareinsights.com allow the Cloudflare
# Web Analytics beacon that the proxied domain auto-injects (cookieless).
allowed_domains = [
    { directive = "script-src", domains = ["'self'", "'wasm-unsafe-eval'", "static.cloudflareinsights.com"] },
    { directive = "connect-src", domains = ["'self'", "cloudflareinsights.com"] },
]

[extra.responsive_images]
widths = [640, 784, 1280, 1920, 2560]
fallback_width = 1280
